name: Daily SportAdmin roster sync

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync junior rosters
        shell: bash
        env:
          SYNC_KEY: ${{ secrets.KRONANG_SPORTADMIN_SYNC_KEY }}
        run: |
          if [ -z "$SYNC_KEY" ]; then
            echo 'KRONANG_SPORTADMIN_SYNC_KEY is not configured.' >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            -H "x-kronang-sync-key: $SYNC_KEY" \
            --data '{}' \
            'https://ndbwnsiqcnxppikdrwvd.supabase.co/functions/v1/sportadmin-roster-sync'
